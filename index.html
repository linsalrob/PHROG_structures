<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHROG Structure Gallery</title>
  <link rel="preconnect" href="https://projects.pawsey.org.au" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
    header, nav, footer { padding: 1em; background: #222; color: white; text-align: center; }
    nav a { color: #61dafb; margin: 0 1em; text-decoration: none; }
    footer a { color: #61dafb; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 5px; padding: 10px; max-width: 1060px; margin: 0 auto; }
    .grid img { width: 100%; max-width: 100px; aspect-ratio: 1; cursor: pointer; border: 1px solid #ccc; background: white; box-sizing: border-box; justify-self: center; }
    .montage-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; }
    .montage-list a { display: inline-block; max-width: 100%; box-sizing: border-box; border: 1px solid #ccc; padding: 5px; background: white; text-align: center; text-decoration: none; color: black; }
    .montage-list img { max-width: 100%; height: auto; }
    .full-image { display: block; margin: 20px auto; max-width: 90%; }
    .link-wrapper { text-align: center; margin: 10px; font-size: 1.1em; }
    .search-box { text-align: center; margin: 20px; position: relative; }
    .search-box input { padding: 5px; font-size: 1em; width: 200px; }
    .search-box button { padding: 6px 10px; font-size: 1em; }
    .autocomplete-items { position: absolute; border: 1px solid #ccc; background: white; width: 200px; max-height: 150px; overflow-y: auto; z-index: 99; left: 50%; transform: translateX(-50%); }
    .autocomplete-items:empty { display: none; }
    .autocomplete-items div { padding: 5px; cursor: pointer; }
    .autocomplete-items div:hover { background-color: #f1f1f1; }
    .spinner { display: none; margin: 20px auto; border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .error-message { text-align: center; color: red; font-weight: bold; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Phage Protein Structure Gallery</h1>
    <h3>Images by Susie Grigson, with help from George Bouras and Rob Edwards</h3>
  </header>
  <nav>
    <a href="#/">Home</a>
    <a href="#/montages/monomers">Monomer Montages</a>
    <a href="#/montages/oligomers">Oligomer Montages</a>
  </nav>
  <main id="app"></main>
  <div id="spinner" class="spinner"></div>
  <div id="errorMessage" class="error-message">Image could not be loaded. This PHROG may not have an image yet.</div>
  <footer>
    <p>&copy; 2025&ndash;<span id="year">2026</span> <a href="https://fame.flinders.edu.au">FAME</a></p>
  </footer>
  <script>
    // PHROGs are stored in groups of 100: PHROG 505 is phrog_005/phrog_00505.
    const NGROUPS = 389;     // phrog_000 .. phrog_388
    const MAX_PHROG = 38880;
    const MODES = ['monomers', 'oligomers'];

    // Images and PDB files are served from the public Pawsey Acacia bucket, not GitHub Pages.
    // Object keys are the paths used in the repository, e.g. png/phrog_005/phrog_00505.png.
    const ASSET_BASE = 'https://projects.pawsey.org.au/phrogstructures-public/';
    const DIRS = {
      monomers: { png: 'png', thumbnails: 'thumbnails', pdb: 'pdb', montage: 'montage' },
      oligomers: { png: 'oligomer_png', thumbnails: 'oligomer_thumbnails', pdb: 'oligomer_pdb', montage: 'oligomer_montage' },
    };
    const assetUrl = (mode, kind, id, name) => kind === 'montage'
      ? `${ASSET_BASE}${DIRS[mode].montage}/${id}_montage.png`
      : `${ASSET_BASE}${DIRS[mode][kind]}/${id}/${name}.${kind === 'pdb' ? 'pdb.gz' : 'png'}`;

    // manifest.json (made by scripts/build_manifest.py) says which assets exist, so pages only
    // request images that are there. If it cannot be loaded, every possible image is requested.
    let MANIFEST = null;
    const has = (mode, kind, phrog) => {
      if (!MANIFEST) return true;
      const hex = MANIFEST.modes[mode][kind][Math.floor(phrog / 100)];
      const i = phrog % 100;
      return Boolean(hex) && ((parseInt(hex[i >> 2], 16) >> (3 - (i & 3))) & 1) === 1;
    };

    const groupId = (g) => `phrog_${g.toString().padStart(3, '0')}`;
    const phrogName = (n) => `phrog_${n.toString().padStart(5, '0')}`;
    const isGroupId = (id) => /^phrog_\d{3}$/.test(id) && parseInt(id.slice(6), 10) < NGROUPS;
    const isPhrogName = (id, name) => new RegExp(`^${id}\\d{2}$`).test(name);
    const groupRange = (id) => {
      const g = parseInt(id.slice(6), 10);
      return `PHROGs ${Math.max(1, g * 100)}&ndash;${Math.min(g * 100 + 99, MAX_PHROG)}`;
    };

    const routes = {
      '/': () => `
        <section id="intro">
          <h2>Introduction</h2>
          <p>This site hosts an interactive gallery of phage datasets. Browse monomer and oligomer structures, montages, and thumbnails.</p>
          <p>The <a href="https://phrogs.lmge.uca.fr/">Prokaryotic Virus Remote Homologous Groups</a> (PHROGS) cover genomes of viruses infecting Bacteria
          and Archaea. We have generated PDB structure files for representatives of each PHROG, and present them here.</p>
          <p>Example:
            <a href="#/dataset/monomers/phrog_005/phrog_00505">
              PHROG 505 monomer
            </a>
          </p>
          <div class="search-box">
            <input type="text" id="phrogInput" inputmode="numeric" placeholder="Enter PHROG number (e.g., 505)" oninput="phrogAutocomplete(this)" onkeydown="if (event.key === 'Enter') goToPhrog('monomers')" />
            <div id="autocomplete-list" class="autocomplete-items"></div>
            <button onclick="goToPhrog('monomers')">Go (Monomer)</button>
            <button onclick="goToPhrog('oligomers')">Go (Oligomer)</button>
          </div>
        </section>
      `,
      '/montages/:mode': (mode) => {
        let html = `<section id="montages"><h2>${mode} Montages</h2>`;
        html += '<div class="montage-list">';
        for (let i = 0; i < NGROUPS; i++) {
          const id = groupId(i);
          const src = !MANIFEST || MANIFEST.modes[mode].montage.includes(i) ? assetUrl(mode, 'montage', id) : 'images/not_available.png';
          html += `<a href="#/dataset/${mode}/${id}"><img src="${src}" alt="Montage ${id}" loading="lazy" onerror="this.onerror=null; this.src='images/not_available.png'"><br>${id}<br>${groupRange(id)}</a>`;
        }
        html += '</div></section>';
        return html;
      },
      '/dataset/:mode/:id': (mode, id) => {
        const first = parseInt(id.slice(6), 10) * 100;
        const members = [];
        for (let i = 0; i < 100; i++) {
          const n = first + i;
          if (!MANIFEST || has(mode, 'thumbnails', n) || has(mode, 'png', n) || has(mode, 'pdb', n)) members.push(n);
        }
        let html = `<h2>${mode}: ${groupRange(id)} (${id})</h2>`;
        html += `<p style="text-align:center">PHROGs are grouped in sets of 100. This page shows every PHROG in ${id}`;
        html += MANIFEST ? ` with a ${mode.slice(0, -1)} structure (${members.length} of 100)` : '';
        html += '; click a thumbnail to view that structure.</p>';

        const otherMode = mode === 'oligomers' ? 'monomers' : 'oligomers';
        html += '<div class="mode-toggle" style="text-align:center; margin:10px;">';
        html += `<button onclick="switchMode('${mode}','${id}')">Switch to ${otherMode}</button>`;
        html += '</div>';

        html += '<img id="fullImage" class="full-image" style="display:none;">';
        html += '<div id="linkWrapper" class="link-wrapper" style="display:none">';
        html += '<a id="permaLink" class="perma-link">Permanent Link</a><span id="linkSep"> | </span><a id="downloadLink" class="download-link">Download PDB</a>';
        html += '</div>';
        html += `<h3>All ${groupRange(id)}</h3>`;
        html += `<div class="grid">`;
        for (const n of members) {
          const name = phrogName(n);
          const src = has(mode, 'thumbnails', n) ? assetUrl(mode, 'thumbnails', id, name) : 'images/not_available.png';
          html += `<img src="${src}" alt="${name}" title="PHROG ${n}" loading="lazy" onclick="viewImage('${mode}','${id}','${name}')" onerror="this.onerror=null; this.src='images/not_available.png'">`;
        }
        html += '</div>';
        return html;
      }
    };

    function goToPhrog(mode) {
      const input = document.getElementById('phrogInput').value.trim();
      const num = parseInt(input, 10);
      if (/^\d+$/.test(input) && num >= 1 && num <= MAX_PHROG) {
        const id = groupId(Math.floor(num / 100));
        window.location.hash = `#/dataset/${mode}/${id}/${phrogName(num)}`;
      } else {
        alert(`Please enter a valid PHROG number between 1 and ${MAX_PHROG}.`);
      }
    }

    function phrogAutocomplete(input) {
      const list = document.getElementById('autocomplete-list');
      list.innerHTML = '';
      const val = input.value.trim();
      if (!/^\d+$/.test(val) || parseInt(val, 10) < 1) return;
      // Suggest up to 20 PHROG numbers starting with the typed digits, shortest first.
      const matches = [];
      for (let n = parseInt(val, 10), span = 1; n <= MAX_PHROG && matches.length < 20; n *= 10, span *= 10) {
        for (let k = n; k < n + span && k <= MAX_PHROG && matches.length < 20; k++) {
          matches.push(k);
        }
      }
      for (const num of matches) {
        const item = document.createElement('div');
        item.textContent = num;
        item.onclick = () => {
          input.value = num;
          list.innerHTML = '';
        };
        list.appendChild(item);
      }
    }

    function viewImage(mode, phrogId, name) {
      const spinner = document.getElementById('spinner');
      const error = document.getElementById('errorMessage');
      const img = document.getElementById('fullImage');
      const wrapper = document.getElementById('linkWrapper');
      const link = document.getElementById('downloadLink');
      const perm = document.getElementById('permaLink');
      const sep = document.getElementById('linkSep');
      const phrog = parseInt(name.slice(6), 10);
      const hasPdb = has(mode, 'pdb', phrog);
      const showError = (msg) => {
        spinner.style.display = 'none';
        error.textContent = msg;
        error.style.display = 'block';
        img.style.display = 'none';
      };
      error.style.display = 'none';

      img.onload = () => { spinner.style.display = 'none'; error.style.display = 'none'; };
      img.onerror = () => {
        showError('Image could not be loaded. This PHROG may not have an image yet.');
        // Without the manifest we cannot tell whether the PDB file exists either.
        if (!MANIFEST) wrapper.style.display = 'none';
      };

      wrapper.style.display = 'block';
      link.style.display = sep.style.display = hasPdb ? 'inline' : 'none';
      link.href = assetUrl(mode, 'pdb', phrogId, name);
      link.download = `${name}.pdb.gz`;
      link.textContent = `Download ${name}.pdb.gz`;
      perm.href = `#/dataset/${mode}/${phrogId}/${name}`;
      perm.textContent = `Permanent link to ${name}`;
      if (has(mode, 'png', phrog)) {
        spinner.style.display = 'block';
        img.src = assetUrl(mode, 'png', phrogId, name);
        img.style.display = 'block';
      } else {
        img.removeAttribute('src');
        showError(hasPdb ? `There is no image of ${name} yet, but its structure can be downloaded.`
                         : `PHROG ${phrog} has no ${mode.slice(0, -1)} structure.`);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function parseRoute() {
      const hash = window.location.hash || '#/';
      const parts = hash.slice(2).split('/');
      const route = '/' + parts[0];
      const app = document.getElementById('app');
      document.getElementById('errorMessage').style.display = 'none';
      document.getElementById('spinner').style.display = 'none';

      // Only validated values from the URL ever reach innerHTML.
      const mode = MODES.includes(parts[1]) ? parts[1] : null;
      if (route === '/dataset' && mode && isGroupId(parts[2]) && parts.length <= 4) {
        app.innerHTML = routes['/dataset/:mode/:id'](mode, parts[2]);
        if (parts[3] && isPhrogName(parts[2], parts[3])) {
          setTimeout(() => viewImage(mode, parts[2], parts[3]), 0);
        }
      } else if (route === '/montages' && mode && parts.length === 2) {
        app.innerHTML = routes['/montages/:mode'](mode);
      } else if (route === '/' && parts.length === 1) {
        app.innerHTML = routes['/']();
      } else {
        app.innerHTML = '<p>Page not found</p>';
      }
    }

    function switchMode(currentMode, phrogId) {
	const hashParts = window.location.hash.split('/');
	const currentName = hashParts[4]; // may be undefined
	const newMode = currentMode === 'oligomers' ? 'monomers' : 'oligomers';
	if (currentName) {
		window.location.hash = `#/dataset/${newMode}/${phrogId}/${currentName}`;
	} else {
		window.location.hash = `#/dataset/${newMode}/${phrogId}`;
	}
   }

    document.getElementById('year').textContent = new Date().getFullYear();
    window.addEventListener('load', () => {
      Promise.resolve()
        .then(() => fetch('manifest.json'))
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null)
        .then((m) => {
          MANIFEST = m && m.modes ? m : null;
          window.addEventListener('hashchange', parseRoute);
          parseRoute();
        });
    });
  </script>
</body>
</html>
